name: Continuous Integration & Verification Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-build:
    name: Build & Security Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Initialize Database Schema & Seed Data
        env:
          DATABASE_URL: "file:./dev.db"
        run: |
          npx prisma generate
          npx prisma db push
          npm run seed

      - name: Run Automated Vitest Security Test Suite
        env:
          DATABASE_URL: "file:./dev.db"
          JWT_SECRET: "test-jwt-secret-key-12345"
        run: npm run test

      - name: Run End-to-End Verification
        env:
          DATABASE_URL: "file:./dev.db"
          JWT_SECRET: "test-jwt-secret-key-12345"
        run: node scripts/e2e-verify.js

      - name: Build Next.js Production App
        env:
          DATABASE_URL: "file:./dev.db"
          JWT_SECRET: "test-jwt-secret-key-12345"
        run: npm run build
